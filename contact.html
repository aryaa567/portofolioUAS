<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Arya Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Arya<span>Portfolio</span></a>
      <nav class="nav" id="nav-menu">
        <a href="index.html#home" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="projects.html" class="nav-link">Projects</a>
        <a href="contact.html" class="nav-link active">Contact</a>
      </nav>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="contact section" id="contact">
      <div class="container section-header" data-animate>
        <h2>Contact Me</h2>
        <p>Silakan hubungi saya melalui email, WhatsApp, atau isi formulir di bawah ini.</p>
      </div>
      <div class="container contact-layout">
        <div class="contact-info" data-animate>
          <div class="contact-card">
            <h4>📧 Email</h4>
            <p>arya@example.com</p>
          </div>
          <div class="contact-card">
            <h4>📱 WhatsApp</h4>
            <p>+62 812 3456 7890</p>
          </div>
          <div class="contact-card">
            <h4>📍 Bali</h4>
            <p>Indonesia</p>
          </div>
          <div class="contact-card">
            <h4>🌐 GitHub</h4>
            <p>github.com/aryamahendrawan</p>
          </div>
        </div>
        <form class="contact-form" id="contact-form" data-animate>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your email" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>

          <button type="submit" class="btn btn-primary">Send Message</button>
          <p class="form-feedback" id="form-feedback"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <p>© 2026 Arya Portfolio</p>
      <div class="footer-links">
        <a href="#">Instagram</a>
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
  </footer>

  <button class="scroll-top" id="scroll-top" aria-label="Back to top">↑</button>
  <script src="js/script.js"></script>
</body>
</html>
